name: Build vLLM cu128 A800

on:
  workflow_dispatch:

env:
  VLLM_VERSION: "0.26.0"
  PYTHON_VERSION: "3.12"

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 350

    container:
      image: nvidia/cuda:12.8.0-devel-ubuntu22.04
      options: --user root

    steps:
      - name: Install system dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -euxo pipefail
          apt-get update
          apt-get install -y --no-install-recommends \
            software-properties-common \
            ca-certificates \
            curl \
            git \
            build-essential \
            ninja-build \
            ccache

          add-apt-repository -y ppa:deadsnakes/ppa
          apt-get update
          apt-get install -y --no-install-recommends \
            python3.12 \
            python3.12-dev \
            python3.12-venv

          curl -sS https://bootstrap.pypa.io/get-pip.py | python3.12
          ln -sf /usr/bin/python3.12 /usr/local/bin/python
          ln -sf /usr/bin/python3.12 /usr/local/bin/python3

      - name: Checkout vLLM
        uses: actions/checkout@v4
        with:
          repository: vllm-project/vllm
          ref: v${{ env.VLLM_VERSION }}
          path: vllm
          fetch-depth: 1

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: /root/.cache/ccache
          key: vllm-${{ env.VLLM_VERSION }}-cu128-sm80-cp312-${{ github.sha }}
          restore-keys: |
            vllm-${{ env.VLLM_VERSION }}-cu128-sm80-cp312-
            vllm-${{ env.VLLM_VERSION }}-cu128-sm80-

      - name: Install PyTorch and build dependencies
        working-directory: vllm
        run: |
          set -euxo pipefail

          python -m pip install -U \
            pip setuptools wheel ninja cmake packaging

          python -m pip install torch \
            --index-url https://download.pytorch.org/whl/cu128

          python -m pip install -r requirements/build.txt
          python use_existing_torch.py

      - name: Build wheel
        working-directory: vllm
        env:
          CUDA_HOME: /usr/local/cuda
          TORCH_CUDA_ARCH_LIST: "8.0"
          MAX_JOBS: "3"
          NVCC_THREADS: "1"
          CMAKE_BUILD_PARALLEL_LEVEL: "3"

          CCACHE_DIR: /root/.cache/ccache
          CCACHE_MAXSIZE: 5G
          CCACHE_COMPRESS: "true"
        run: |
          set -euxo pipefail

          ccache --zero-stats
          ccache --max-size 5G

          free -h
          nproc

          python -m pip wheel . \
            --no-build-isolation \
            --no-deps \
            --wheel-dir dist \
            -v

          ccache --show-stats
          ls -lh dist

      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: vllm-${{ env.VLLM_VERSION }}-cu128-cp312-sm80
          path: vllm/dist/*.whl
          retention-days: 14
          if-no-files-found: error