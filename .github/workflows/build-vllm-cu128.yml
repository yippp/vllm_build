name: Build vLLM cu128 (A100 / A800 / H20)

on:
  workflow_dispatch:
  push:
    branches: [main]

env:
  VLLM_VERSION: "0.26.0"
  CUDA_VERSION: "12.8.0"
  PYTHON_VERSION: "3.12"

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 150

    container:
      image: nvidia/cuda:${{ env.CUDA_VERSION }}-devel-ubuntu22.04
      options: --user root

    steps:
      - name: Install system dependencies
        run: |
          apt-get update
          apt-get install -y \
            git curl wget build-essential ninja-build ccache \
            python${{ env.PYTHON_VERSION }} \
            python${{ env.PYTHON_VERSION }}-dev \
            python${{ env.PYTHON_VERSION }}-venv \
            python3-pip
          update-alternatives --install /usr/bin/python3 python3 /usr/bin/python${{ env.PYTHON_VERSION }} 1
          update-alternatives --install /usr/bin/python  python  /usr/bin/python${{ env.PYTHON_VERSION }} 1

      - name: Checkout vLLM
        uses: actions/checkout@v4
        with:
          repository: vllm-project/vllm
          ref: v${{ env.VLLM_VERSION }}
          path: vllm
          fetch-depth: 0

      - name: Install PyTorch cu128 + build tools
        run: |
          python -m pip install -U pip setuptools wheel ninja cmake packaging
          # 官方推荐：先装匹配的 PyTorch
          python -m pip install torch torchvision torchaudio \
            --index-url https://download.pytorch.org/whl/cu128

      - name: Install vLLM build dependencies
        working-directory: vllm
        run: |
          # 尽量对齐官方 build 依赖
          python -m pip install -r requirements/build.txt || true
          python -m pip install \
            cmake>=3.26.1 ninja packaging setuptools-scm setuptools-rust

      - name: Build wheel (A100/A800 + H20)
        working-directory: vllm
        env:
          # A100 / A800 = sm_80
          # H20 / H100 = sm_90
          TORCH_CUDA_ARCH_LIST: "8.0;9.0"
          MAX_JOBS: "4"
          NVCC_THREADS: "2"
          # 使用已经安装好的 torch，避免重复下载
          VLLM_USE_PRECOMPILED: "0"
        run: |
          # 官方建议：使用已有的 torch
          python use_existing_torch.py || true

          # 编译 wheel（对应官方 build wheel from source）
          python -m pip wheel . \
            --no-build-isolation \
            --no-deps \
            -w dist \
            -v

      - name: Show result
        run: |
          echo "===== Built wheels ====="
          ls -lh vllm/dist/
          echo ""
          file vllm/dist/*.whl || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: vllm-${{ env.VLLM_VERSION }}-cu128-cp312-A100-A800-H20
          path: vllm/dist/*.whl
          retention-days: 14
