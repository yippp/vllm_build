name: Watch upstream vLLM releases

# 2026-09-23：自编译自动轮询已停用。
# 用户驱动已升至 CUDA 13.2，改用官方 vLLM cu130（PyPI 默认）；无官方 cu132。
# 勿重新加回 schedule，除非用户明确要求恢复自编译。
# 保留 workflow_dispatch，仅供极少数手动排查；默认不要跑。

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: watch-vllm-release
  cancel-in-progress: false

jobs:
  check:
    name: Check for new upstream release
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    outputs:
      should_build: ${{ steps.decide.outputs.should_build }}
      version: ${{ steps.decide.outputs.version }}

    steps:
      - name: Decide whether to build
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail

          # 上游与本仓库 API 都带 token，避免 Actions 共享出口 IP 的未认证限流（403）。
          fetch_json() {
            local url="$1"
            local out="$2"
            local attempt http_code
            for attempt in 1 2 3; do
              http_code="$(curl --silent --output "${out}" --write-out '%{http_code}' \
                -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                -H "Authorization: Bearer ${GH_TOKEN}" \
                "${url}" || true)"
              if [ "${http_code}" = "200" ] || [ "${http_code}" = "404" ]; then
                echo "${http_code}"
                return 0
              fi
              echo "HTTP ${http_code} for ${url} (attempt ${attempt}/3)" >&2
              if [ "${attempt}" -lt 3 ] && { [ "${http_code}" = "403" ] || [ "${http_code}" = "429" ]; }; then
                sleep $((10 * attempt))
                continue
              fi
              echo "Unexpected response for ${url}: HTTP ${http_code}" >&2
              cat "${out}" >&2 || true
              return 1
            done
            return 1
          }

          UPSTREAM_CODE="$(fetch_json \
            https://api.github.com/repos/vllm-project/vllm/releases/latest \
            /tmp/upstream_release.json)"
          if [ "${UPSTREAM_CODE}" != "200" ]; then
            echo "Failed to fetch upstream latest release: HTTP ${UPSTREAM_CODE}"
            cat /tmp/upstream_release.json || true
            exit 1
          fi

          TAG="$(python3 -c 'import json; print(json.load(open("/tmp/upstream_release.json"))["tag_name"])')"
          VERSION="${TAG#v}"
          OUR_TAG="v${VERSION}"

          echo "Upstream latest: ${OUR_TAG}"

          HTTP_CODE="$(fetch_json \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/tags/${OUR_TAG}" \
            /tmp/our_release.json)"

          if [ "${HTTP_CODE}" = "200" ]; then
            echo "Release ${OUR_TAG} already exists in ${GITHUB_REPOSITORY}; skip build."
            echo "should_build=false" >> "${GITHUB_OUTPUT}"
            echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          if [ "${HTTP_CODE}" != "404" ]; then
            echo "Unexpected response checking local release: HTTP ${HTTP_CODE}"
            cat /tmp/our_release.json || true
            exit 1
          fi

          echo "No local release for ${OUR_TAG}; will build."
          echo "should_build=true" >> "${GITHUB_OUTPUT}"
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"

  build:
    name: Build new upstream version
    needs: check
    if: ${{ needs.check.outputs.should_build == 'true' }}
    uses: ./.github/workflows/build-vllm-cu126.yml
    with:
      vllm_version: ${{ needs.check.outputs.version }}
      create_release: true
    secrets: inherit